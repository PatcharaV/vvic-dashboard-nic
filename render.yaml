services:
  - type: web
    name: vvic-dashboard-nic
    runtime: python
    plan: free
    buildCommand: python -m pip install --timeout 120 --retries 10 -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENABLE_MANUAL_SCRAPE
        value: "true"
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: OPENAI_API_KEY
        sync: false
