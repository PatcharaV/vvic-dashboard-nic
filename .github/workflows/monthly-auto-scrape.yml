name: Monthly Auto Scrape

on:
  schedule:
    # 08:00 Bangkok time on the 1st day of every month.
    - cron: "0 1 1 * *"
    # 08:15 Bangkok time on days 2-7 as a catch-up if day 1 was missed.
    - cron: "15 1 2-7 * *"
    # One-time validation window: 10:00-10:50 Bangkok time on 7 Aug 2026.
    - cron: "0,10,20,30,40,50 3 7 8 *"
  workflow_dispatch:
    inputs:
      month:
        description: Month code to scrape, for example AUG
        required: false
        type: string
      year:
        description: Year to scrape, for example 2026
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-auto-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check scheduled run date
        id: schedule_guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.schedule }}" = "0 1 1 * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          one_time_schedule="0,10,20,30,40,50 3 7 8 *"
          one_time_key="one-time-2026-08-07-1000"
          if [ "${{ github.event.schedule }}" = "$one_time_schedule" ]; then
            if python -c 'import json, sys; from pathlib import Path; path = Path("backend/data/auto_scrape_runs.json"); status = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}; raise SystemExit(0 if status.get(sys.argv[1], {}).get("status") == "completed" else 1)' "$one_time_key"
            then
              echo "One-time validation scrape already completed."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Running one-time validation scrape for 7 Aug 2026 10:00 Bangkok time."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bangkok_month="$(TZ=Asia/Bangkok date +%b | tr '[:lower:]' '[:upper:]')"
          bangkok_year="$(TZ=Asia/Bangkok date +%Y)"
          monthly_key="monthly-${bangkok_year}-${bangkok_month}"
          if python -c 'import json, sys; from pathlib import Path; path = Path("backend/data/monthly_auto_scrape_status.json"); status = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}; raise SystemExit(0 if status.get("key") == sys.argv[1] and status.get("status") == "completed" else 1)' "$monthly_key"
          then
            echo "Monthly scrape already completed for ${monthly_key}."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.schedule }}" = "15 1 2-7 * *" ]; then
            echo "Catch-up scrape required for ${monthly_key}."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping unrecognized schedule ${{ github.event.schedule }}."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: python -m pip install --timeout 120 --retries 10 -r backend/requirements.txt

      - name: Install frontend dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run monthly scrape and persist snapshot
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          if [ -n "${{ inputs.month }}" ] && [ -n "${{ inputs.year }}" ]; then
            python tools/monthly_scrape_snapshot.py --month "${{ inputs.month }}" --year "${{ inputs.year }}"
          elif [ "${{ github.event.schedule }}" = "0,10,20,30,40,50 3 7 8 *" ]; then
            AUTO_SCRAPE_RUN_KEY="one-time-2026-08-07-1000" python tools/monthly_scrape_snapshot.py --month AUG --year 2026
          else
            python tools/monthly_scrape_snapshot.py
          fi

      - name: Build frontend
        if: steps.schedule_guard.outputs.should_run == 'true'
        working-directory: frontend
        run: npm run build

      - name: Commit monthly scrape output
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/history backend/data/NIC\ DASHBOARD backend/data/audits backend/data/products.json backend/data/monthly_auto_scrape_status.json backend/data/auto_scrape_runs.json frontend/src/snapshotData.json frontend/dist
          if git diff --cached --quiet; then
            echo "No monthly scrape changes to commit."
            exit 0
          fi
          git commit -m "Add monthly catalog snapshot"
          git push
