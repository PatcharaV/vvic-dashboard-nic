name: Monthly Auto Scrape

on:
  schedule:
    # 08:00 Bangkok time on the 1st day of every month.
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: Month code to scrape, for example AUG
        required: false
        type: string
      year:
        description: Year to scrape, for example 2026
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --timeout 120 --retries 10 -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run monthly scrape and persist snapshot
        run: |
          if [ -n "${{ inputs.month }}" ] && [ -n "${{ inputs.year }}" ]; then
            python tools/monthly_scrape_snapshot.py --month "${{ inputs.month }}" --year "${{ inputs.year }}"
          else
            python tools/monthly_scrape_snapshot.py
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit monthly scrape output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/history backend/data/NIC\ DASHBOARD backend/data/audits backend/data/products.json frontend/src/snapshotData.json frontend/dist
          if git diff --cached --quiet; then
            echo "No monthly scrape changes to commit."
            exit 0
          fi
          git commit -m "Add monthly catalog snapshot"
          git push
